name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict, 3 packages)
        run: pnpm typecheck

      - name: Lint (eslint --max-warnings=20)
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build backend (tsc)
        run: pnpm --filter backend build

      - name: Build frontend (next build)
        run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_BACKEND_WS_URL: wss://example.invalid/api
          NEXT_PUBLIC_BACKEND_HTTP_URL: https://example.invalid/api